name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge bot run CI on main after it merges (merges made
  # with GITHUB_TOKEN do not trigger push workflows).
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  # The same suite runs on both engines. SQLite is what contributors get
  # with no setup; Postgres is what production runs, and the two disagree on
  # string ordering and comparison in ways that only show up with real data.
  test:
    name: test (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            database-url: ''
          - engine: postgres
            database-url: 'postgresql://sci:sci@localhost:5432/sci_healthcare_test'
    # Started for both entries; the SQLite entry simply never connects. The
    # health gate keeps the Postgres entry from racing the container's boot.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sci
          POSTGRES_PASSWORD: sci
          POSTGRES_DB: sci_healthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ matrix.database-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Prisma cannot read the provider from the environment, so the schema
      # is switched before generating the client for Postgres.
      - if: matrix.engine == 'postgres'
        run: ./scripts/use-postgres.sh
      - run: npx prisma generate
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  bot:
    name: auto-merge bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test .github/scripts/automerge.test.cjs
